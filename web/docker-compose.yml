# Local Postgres for development. Production uses Supabase (same Postgres).
#   npm run db:up        # start
#   npm run db:migrate   # create/upgrade tables
#   npm run db:seed      # synthetic sample data + admin user
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: r1
      POSTGRES_PASSWORD: r1
      POSTGRES_DB: r1
    ports:
      - "5432:5432"
    volumes:
      - r1-pgdata:/var/lib/postgresql/data
      - ./scripts/docker-init.sql:/docker-entrypoint-initdb.d/10-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U r1 -d r1"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  r1-pgdata:
