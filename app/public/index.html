<style>
:root{
  --bg:oklch(0.968 0.006 255);--surface:#ffffff;--surface-2:oklch(0.983 0.004 255);
  --border:oklch(0.906 0.008 255);--border-2:oklch(0.855 0.01 255);
  --ink:oklch(0.28 0.02 262);--ink-2:oklch(0.5 0.016 262);--ink-3:oklch(0.635 0.012 262);
  --accent:oklch(0.55 0.17 256);--accent-2:oklch(0.485 0.17 256);--accent-soft:oklch(0.955 0.028 256);
  --ok:oklch(0.6 0.13 155);--ok-soft:oklch(0.955 0.045 155);
  --warn:oklch(0.68 0.13 70);--warn-soft:oklch(0.955 0.06 82);
  --danger:oklch(0.57 0.19 25);--danger-soft:oklch(0.955 0.04 25);
  --pad:28px;--gap:18px;--card:22px;--radius:13px;--fs:15px;--spot:50px;--h:44px;--side:240px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{font-family:'IBM Plex Sans',system-ui,sans-serif;font-size:var(--fs);line-height:1.45;color:var(--ink);background:var(--bg);min-height:100vh;display:flex;-webkit-font-smoothing:antialiased;}
a{color:var(--accent);text-decoration:none;}
input,select,button,textarea{font-family:inherit;font-size:inherit;color:inherit;}
input::placeholder{color:oklch(0.72 0.01 262);}
input:focus,select:focus{outline:2px solid oklch(0.55 0.17 256 / 0.35);outline-offset:0;}
button{font-family:'IBM Plex Sans',sans-serif;}
.mono{font-family:'IBM Plex Mono',monospace;}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-thumb{background:oklch(0.86 0.008 255);border-radius:8px;}
::-webkit-scrollbar-track{background:transparent;}
@keyframes r1pop{from{opacity:0;transform:translateY(10px) scale(.985);}to{opacity:1;transform:none;}}
@keyframes r1fade{from{opacity:0;}to{opacity:1;}}
.page{animation:r1fade .25s ease;}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);}
.label{font-size:11px;font-weight:600;letter-spacing:0.04em;text-transform:uppercase;color:var(--ink-3);}
.navbtn{position:relative;display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:transparent;border:0;padding:10px 12px;border-radius:9px;cursor:pointer;color:var(--ink-2);font-weight:500;overflow:hidden;font-size:14px;}
.navbtn.on{color:var(--ink);font-weight:600;}
.navbtn.on::before{content:'';position:absolute;inset:0;background:var(--accent-soft);z-index:0;border-radius:9px;}
.navbtn.on::after{content:'';position:absolute;left:0;top:7px;bottom:7px;width:3px;background:var(--accent);border-radius:0 3px 3px 0;}
.navbtn span{position:relative;z-index:1;}
.chip{height:30px;padding:0 12px;border:0;border-radius:7px;font-weight:500;font-size:12px;cursor:pointer;background:transparent;color:var(--ink-3);}
.chip.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px oklch(0.2 0.02 260 / .12);font-weight:600;}
.field label{display:block;font-size:12px;font-weight:500;color:var(--ink-2);margin-bottom:6px;}
.field input,.field select{width:100%;height:var(--h);padding:0 12px;border:1px solid var(--border-2);border-radius:8px;background:var(--surface);}
.r1-swal{border-radius:16px!important;font-family:'IBM Plex Sans',sans-serif!important;padding:8px 4px!important;box-shadow:0 24px 60px oklch(0.2 0.02 260 / .3)!important;}
.r1-swal .swal2-title{font-size:20px!important;font-weight:600!important;color:var(--ink)!important;}
.r1-swal .swal2-html-container{color:var(--ink-2)!important;font-size:14px!important;}
.r1-btn{height:44px;padding:0 22px;border:0;border-radius:11px;font-weight:600;font-size:15px;cursor:pointer;margin:0 5px;font-family:inherit;}
.r1-btn-primary{background:var(--accent);color:#fff;box-shadow:0 1px 2px oklch(0.55 0.17 256 / .3);}
.r1-btn-primary:hover{background:var(--accent-2);}
.r1-btn-ghost{background:var(--surface);color:var(--ink-2);border:1px solid var(--border-2);}
.r1-btn-danger{background:var(--danger);color:#fff;}
.r1-toast{border-radius:12px!important;font-family:'IBM Plex Sans',sans-serif!important;}
.swal2-container{z-index:2000!important;}
/* Sub-tabs inside a screen (Noliktava: Darāmie / Pasūtīt / Vēsture) */
.subtab{background:transparent;border:0;border-bottom:2px solid transparent;padding:10px 2px;margin-bottom:-1px;cursor:pointer;font-size:14px;font-weight:500;color:var(--ink-3);white-space:nowrap;}
.subtab:hover{color:var(--ink-2);}
.subtab.on{color:var(--ink);font-weight:600;border-bottom-color:var(--accent);}
.tabrow:hover{background:var(--surface-2);}
.custrow:hover{background:var(--surface-2);}
/* ===== Responsive / mobile ===== */
#hamburger{display:none;width:40px;height:40px;flex:none;align-items:center;justify-content:center;border:1px solid var(--border-2);background:var(--surface);border-radius:9px;cursor:pointer;font-size:19px;color:var(--ink-2);}
#nav-backdrop{display:none;}
@media(max-width:860px){
  :root{--pad:16px;--gap:14px;--card:16px;}
  body>aside{position:fixed!important;left:0;top:0;bottom:0;height:100vh;z-index:160;transform:translateX(-100%);transition:transform .25s ease;box-shadow:0 0 44px oklch(0.2 0.02 260/.28);}
  body.nav-open>aside{transform:none;}
  #nav-backdrop{position:fixed;inset:0;background:oklch(0.2 0.02 260/.45);z-index:150;}
  body.nav-open #nav-backdrop{display:block;}
  #hamburger{display:inline-flex;}
  #hdr-greet{display:none;}
  main{width:100%;min-width:0;}
  .rrow{flex-direction:column!important;}
  .rside{width:100%!important;}
  .rside .card{position:static!important;}
  .rgrid2,.rgridside,.ragrid{grid-template-columns:1fr!important;}
  .rf3{grid-template-columns:1fr 1fr!important;}
  .rf2{grid-template-columns:1fr!important;}
  .rrow>*,.rgridside>*{min-width:0!important;width:100%!important;max-width:100%!important;}
  .cust-list{max-height:none!important;}
  /* Warehouse: stack the job card so the "Gatavs" button is a full-width target */
  .twrap{flex-direction:column!important;}
  .tbtns{flex-direction:row!important;width:100%;}
  .tbtns>button{flex:1;}
  .tcompose{flex-direction:column!important;}
  .tcompose>textarea,.tcompose>button{width:100%;}
}
@media(max-width:480px){
  .rf3{grid-template-columns:1fr!important;}
}
</style>
</head>
<body>

<!-- SIDEBAR -->
<aside style="width:var(--side);flex:none;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;">
  <div style="display:flex;align-items:center;gap:11px;padding:20px 18px;border-bottom:1px solid var(--border);">
    <div style="width:38px;height:38px;flex:none;border-radius:10px;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:16px;">R1</div>
    <div><div style="font-weight:600;font-size:15px;">R1 Tires</div><div style="font-size:11px;color:var(--ink-3);">Riepu noliktava · <span id="buildtag">build 39</span></div></div>
  </div>
  <nav style="padding:14px 12px;display:flex;flex-direction:column;gap:2px;flex:1;">
    <button class="navbtn" data-nav="home"><span>◧&nbsp; Sākums</span></button>
    <button class="navbtn" data-nav="warehouse"><span>▦&nbsp; Noliktava <span id="nav-task-badge" style="display:none;margin-left:auto;font-size:10px;font-weight:700;background:var(--danger);color:#fff;border-radius:9px;padding:1px 7px;"></span></span></button>
    <div style="height:1px;background:var(--border);margin:8px 12px;"></div>
    <button class="navbtn" data-nav="intake"><span>↓&nbsp; Pieņemšana</span></button>
    <button class="navbtn" data-nav="release"><span>↑&nbsp; Izsniegšana</span></button>
    <button class="navbtn" data-nav="pending"><span>◔&nbsp; Sagatavotie <span id="nav-pending-badge" style="display:none;margin-left:auto;font-size:10px;font-weight:700;background:var(--warn);color:#fff;border-radius:9px;padding:1px 7px;"></span></span></button>
    <button class="navbtn" data-nav="spots"><span>⊞&nbsp; Novietnes</span></button>
    <button class="navbtn" data-nav="customers"><span>◉&nbsp; Klienti</span></button>
    <button class="navbtn" data-nav="table"><span>▤&nbsp; Tabula</span></button>
    <button class="navbtn" data-nav="analytics"><span>◫&nbsp; Analītika</span></button>
    <button class="navbtn" data-nav="history"><span>≡&nbsp; Vēsture</span></button>
    <button class="navbtn" data-nav="users" id="nav-users" style="display:none;"><span>◔&nbsp; Lietotāji</span></button>
    <button class="navbtn" data-nav="settings" id="nav-settings" style="display:none;"><span>⚙&nbsp; Iestatījumi</span></button>
  </nav>
  <div style="padding:16px 18px;border-top:1px solid var(--border);">
    <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;">
      <span class="label">Noslodze</span><span class="mono" id="side-cap" style="font-weight:600;font-size:14px;">—%</span>
    </div>
    <div style="height:8px;background:var(--border);border-radius:6px;overflow:hidden;"><div id="side-capbar" style="height:100%;width:0%;background:var(--accent);border-radius:6px;"></div></div>
    <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--ink-3);margin-top:6px;"><span id="side-occ">—</span><span id="side-free">—</span></div>
  </div>
</aside>

<!-- MAIN -->
<main style="flex:1;min-width:0;display:flex;flex-direction:column;">
  <div style="display:flex;justify-content:space-between;align-items:center;gap:14px;padding:12px var(--pad);background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:40;">
    <div style="display:flex;align-items:center;gap:12px;min-width:0;">
      <button id="hamburger" aria-label="Izvēlne">☰</button>
      <div id="hdr-greet" style="font-size:13px;color:var(--ink-3);font-weight:500;"></div>
    </div>
    <div style="display:flex;align-items:center;gap:10px;">
      <button id="btn-changepass" class="chip" style="display:none;background:var(--surface-2);border:1px solid var(--border);color:var(--ink-2);">Mainīt paroli</button>
      <button id="btn-logout" class="chip" style="display:none;background:var(--surface-2);border:1px solid var(--border);color:var(--ink-2);">Iziet</button>
      <div style="text-align:right;"><div id="hdr-name" style="font-weight:600;font-size:13px;"></div><div id="hdr-role" style="font-size:11px;color:var(--ink-3);"></div></div>
      <div id="hdr-init" style="width:34px;height:34px;border-radius:50%;background:var(--accent-soft);color:var(--accent-2);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:13px;"></div>
    </div>
  </div>
  <div id="view" style="flex:1;"></div>
</main>

<script src="/vendor/sweetalert2.min.js"></script>
<script>
// SweetAlert2 themed to the app (falls back to native if it fails to load)
const hasSwal=typeof Swal!=='undefined';
const R1=hasSwal?Swal.mixin({
  buttonsStyling:false,
  customClass:{popup:'r1-swal',confirmButton:'r1-btn r1-btn-primary',cancelButton:'r1-btn r1-btn-ghost',denyButton:'r1-btn r1-btn-ghost'},
  confirmButtonText:'Labi',cancelButtonText:'Atcelt'
}):null;
const ask=async(opts)=>{ if(!R1){return {isConfirmed:confirm(opts.text||opts.title||'?')}; } return R1.fire({showCancelButton:true,...opts}); };
const toast=(title,icon='success')=>{ if(!R1){return;} Swal.fire({toast:true,position:'top-end',timer:2600,showConfirmButton:false,timerProgressBar:true,icon,title,customClass:{popup:'r1-toast'}}); };
const alertErr=(text)=>{ if(!R1){alert(text);return;} R1.fire({icon:'error',title:'Kļūda',text,showCancelButton:false}); };
</script>
<script>
const $=s=>document.querySelector(s);
const esc=s=>(s==null?'':String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])));
const eur=n=>'€'+Number(n).toFixed(2).replace('.',',');

// ---- Auth token + fetch wrapper: attach Bearer to /api calls, catch expiry ----
const TOKEN_KEY='r1_token';
function getToken(){try{return localStorage.getItem(TOKEN_KEY)||'';}catch{return'';}}
function setToken(t){try{if(t)localStorage.setItem(TOKEN_KEY,t);else localStorage.removeItem(TOKEN_KEY);}catch{}}
let _reauth=false;
function handle401(){if(_reauth)return;_reauth=true;setToken('');S.auth=null;showLogin();}
const _origFetch=window.fetch.bind(window);
window.fetch=function(input,init){
  init=init?Object.assign({},init):{};
  const url=typeof input==='string'?input:(input&&input.url)||'';
  const isApi=/^(?:https?:\/\/[^/]+)?\/api(?:\/|\?|$)/.test(url);
  if(isApi){
    const h=new Headers(init.headers||(typeof input==='object'&&input&&input.headers)||{});
    const t=getToken();
    if(t&&!h.has('Authorization'))h.set('Authorization','Bearer '+t);
    init.headers=h;
    if(!init.credentials)init.credentials='same-origin';
  }
  return _origFetch(input,init).then(function(r){
    if(r.status===401&&isApi&&!/\/api\/(login|me)\b/.test(url))handle401();
    return r;
  });
};

const S={screen:'home',role:'staff',auth:null,users:[],usersLoaded:false,stats:null,activity:[],customers:[],selCustomer:0,custQ:'',custType:'',
  plate:'',looked:false,isNew:false,isCompany:false,cust:'',phone:'',t1size:'',t1brand:'',t1qty:'4',t2size:'',t2brand:'',rim:'none',thread:'',history:0,
  smsOpen:false,smsRec:null,selSpot:null,presetSpot:null,spotHist:[],spotHistLoading:false,spotPickOpen:false,
  relQ:'',relResults:[],relLoading:false,relSearched:false,
  table:null,tableLoaded:false,tabQ:'',tabStatus:'active',tabSort:{col:'location',dir:'asc'},
  pending:[],pendingLoaded:false,swapFromId:null,recOpen:false,recData:null,
  tasks:[],tasksLoaded:false,taskTab:'open',taskDraft:'',taskDest:'',taskDestCustom:'',openTasks:0,pushOn:false,pushCfg:null,
  pricing:null,pricingDraft:null,pricingSaving:false,priceTest:'',
  hist:{list:[],page:0,pages:1,total:0,from:'',to:'',type:'',q:'',loading:false},
  recEvents:[],recEventsLoading:false,
  recPhotos:[],recPhotosLoading:false,recPhotoBusy:'',photoBig:null,
  analytics:null,analyticsLoaded:false,anaSeason:'',anaStatus:'',anaCustomer:'',anaRims:''};

const ROLES={staff:{label:'Personāls',name:'Juris Kalniņš'},manager:{label:'Vadītājs',name:'Ilze Ozola'},owner:{label:'Īpašnieks',name:'Mārtiņš Bērze'}};
const initialsOf=n=>String(n||'—').replace(/^SIA\s*/i,'').replace(/["']/g,'').trim().split(/\s+/).slice(0,2).map(w=>w[0]||'').join('').toUpperCase()||'—';
const MONTHS=['janvāris','februāris','marts','aprīlis','maijs','jūnijs','jūlijs','augusts','septembris','oktobris','novembris','decembris'];
const DAYS=['Svētdiena','Pirmdiena','Otrdiena','Trešdiena','Ceturtdiena','Piektdiena','Sestdiena'];
const now=new Date();
const dateStr=`${DAYS[now.getDay()]}, ${now.getDate()}. ${MONTHS[now.getMonth()]} ${now.getFullYear()}`;
const season=(now.getMonth()+1>=3&&now.getMonth()+1<9?'Pavasaris ':'Rudens ')+now.getFullYear();

const BRANDS=['Michelin','Continental','Nokian','Pirelli','Bridgestone','Goodyear','Hankook','Yokohama','Dunlop','Kumho','Toyo','Falken','Vredestein','Sailun','Nexen','BFGoodrich','Firestone','Sava','Barum','Matador','Fulda','Kleber','Gislaved','Laufenn','Triangle','Linglong'];
const canonBrand=v=>{const t=(v||'').trim();if(!t)return t;const hit=BRANDS.find(b=>b.toLowerCase()===t.toLowerCase());return hit||t.charAt(0).toUpperCase()+t.slice(1);};
// "2255017" -> "225/50/17" while typing
function maskSize(v){const d=String(v||'').replace(/[^0-9]/g,'').slice(0,7);
  if(d.length<=3)return d;
  if(d.length<=5)return d.slice(0,3)+'/'+d.slice(3);
  return d.slice(0,3)+'/'+d.slice(3,5)+'/'+d.slice(5);}

// Pricing mirror of the server. The rules are editable in Iestatījumi and loaded
// at startup, so the intake summary always quotes what the server will charge.
const DEF_PRICING={tiers:[{from:0,to:215,price:15},{from:216,to:245,price:20},{from:246,to:275,price:25},{from:276,to:999,price:30}],rims:{none:1,steel:1.2,aluminum:1.3}};
const pricingCfg=()=>S.pricing||DEF_PRICING;
function tierFor(cfg,w){return (cfg.tiers||[]).find(t=>w>=t.from&&w<=t.to)||(cfg.tiers||[])[(cfg.tiers||[]).length-1]||null;}
function rimMult(cfg,rim){return rim==='aluminum'?cfg.rims.aluminum:rim==='steel'?cfg.rims.steel:cfg.rims.none;}
function price(){const w1=parseInt((S.t1size||'').slice(0,3))||0;const w2=S.t1qty==='2+2'?(parseInt((S.t2size||'').slice(0,3))||0):0;const w=Math.max(w1,w2);
  const cfg=pricingCfg();const t=w?tierFor(cfg,w):null;
  const base=t?t.price:0;const mult=rimMult(cfg,S.rim);
  return {w,base,mult,total:base*mult,cls:t?`${t.from}–${t.to}`:'—'};}

async function loadStats(){try{S.stats=await(await fetch('/api/stats')).json();}catch{S.stats=null;}paintSidebar();}
async function loadActivity(){try{S.activity=(await(await fetch('/api/activity')).json()).events||[];}catch{S.activity=[];}}
async function loadCustomers(){const p=new URLSearchParams();
  if(S.custQ)p.set('q',S.custQ);if(S.custType)p.set('type',S.custType);
  const qs=p.toString()?('?'+p.toString()):'';
  try{S.customers=(await(await fetch('/api/customers'+qs)).json()).customers||[];}catch{S.customers=[];}}
async function loadPricing(){try{const d=await(await fetch('/api/pricing')).json();if(d&&d.pricing)S.pricing=d.pricing;}catch{}}
async function loadTasks(){try{const d=await(await fetch('/api/tasks?status='+(S.taskTab==='done'?'done':'open'))).json();
    S.tasks=d.tasks||[];S.openTasks=d.open||0;}catch{S.tasks=[];}
  S.tasksLoaded=true;paintTaskBadge();}

function paintSidebar(){const st=S.stats;if(!st)return;
  const color=st.capPct>=90?'var(--danger)':st.capPct>=75?'var(--warn)':'var(--accent)';
  $('#side-cap').textContent=st.capPct+'%';
  const bar=$('#side-capbar');bar.style.width=st.capPct+'%';bar.style.background=color;
  $('#side-occ').textContent=st.occ+' aizņemtas';$('#side-free').textContent=st.free+' brīvas';}

function paintHeader(){
  // Demo mode (AUTH_DISABLED on the server) returns a "demo" user — hide the
  // auth UI (users, logout, change-password) so it only appears with real login.
  const demo=!!(S.auth&&S.auth.username==='demo');
  // The warehouse role lives on one screen: hide every other nav entry and the
  // capacity meter (its stats endpoint is desk-only anyway).
  const wh=isWarehouse();
  document.querySelectorAll('[data-nav]').forEach(b=>{if(b.dataset.nav!=='warehouse')b.style.display=wh?'none':'';});
  const cap=document.querySelector('aside > div:last-child');if(cap)cap.style.display=wh?'none':'';
  const name=S.auth?(S.auth.name||S.auth.username||'—'):'—';
  const role=S.auth&&!demo?(S.auth.role==='admin'?'Administrators':S.auth.role==='warehouse'?'Noliktava':'Personāls'):'';
  const set=(id,v)=>{const el=$(id);if(el)el.textContent=v;};
  const show=(id,on)=>{const el=$(id);if(el)el.style.display=on?'':'none';};
  set('#hdr-name',demo?'':name);set('#hdr-role',role);set('#hdr-init',demo?'':initialsOf(name));
  set('#hdr-greet',(S.auth&&!demo)?('Sveiks, '+String(name).split(' ')[0]+'!'):'');
  show('#nav-users',S.auth&&S.auth.role==='admin'&&!demo);
  show('#nav-settings',S.auth&&S.auth.role==='admin');
  show('#btn-logout',!demo&&!!S.auth);show('#btn-changepass',!demo&&!!S.auth);}

function nav(screen){if(isWarehouse())screen='warehouse';S.screen=screen;S.selSpot=null;
  try{localStorage.setItem('r1_last_view',screen);}catch{}
  if(screen==='users'){render();if(!S.usersLoaded)loadUsers().then(()=>{if(S.screen==='users')render();});return;}
  if(screen==='table'){render();if(!S.tableLoaded)loadTable().then(()=>{if(S.screen==='table')render();});return;}
  if(screen==='pending'){render();loadPending().then(()=>{if(S.screen==='pending')render();});return;}
  if(screen==='warehouse'){render();loadTasks().then(()=>{if(S.screen==='warehouse')render();});return;}
  if(screen==='history'){S.hist.page=0;S.hist.list=[];render();loadHist(true);return;}
  if(screen==='settings'){
    // Edit a copy, so "Atcelt izmaiņas" can put the saved rules back.

// Format a stored UTC timestamp into the viewer's LOCAL date + time (DD.MM.YYYY / HH:MM).
// Date-only values (intake/release derived from a date column) show just the date.
function evWhen(s){
  if(!s)return {d:'',t:''};
  s=String(s);
  const md=s.match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if(md)return {d:`${md[3]}.${md[2]}.${md[1]}`,t:''};
  const dt=new Date(s.indexOf('T')<0&&s.indexOf('Z')<0?s.replace(' ','T')+'Z':s); // treat naive UTC strings as UTC
  if(isNaN(dt.getTime()))return {d:s,t:''};
  const p=n=>String(n).padStart(2,'0');
  return {d:`${p(dt.getDate())}.${p(dt.getMonth()+1)}.${dt.getFullYear()}`,t:`${p(dt.getHours())}:${p(dt.getMinutes())}`};
}

  // Lay the cells out: a zone button spans its horizontal run, so the fill cells it

  </div>
  <div style="display:flex;gap:14px;font-size:12px;flex-wrap:wrap;margin-bottom:var(--pad);">
      <span style="display:flex;align-items:center;gap:7px;"><span style="width:14px;height:14px;border-radius:4px;background:var(--ok-soft);border:1px solid oklch(0.8 0.08 155);"></span>Brīvs</span>

      <span style="display:flex;align-items:center;gap:7px;"><span style="width:14px;height:14px;border-radius:4px;background:oklch(0.95 0.04 285);border:1px solid oklch(0.75 0.12 285);"></span>Ar diskiem</span>
      <span style="display:flex;align-items:center;gap:7px;"><span style="width:14px;height:14px;border-radius:4px;background:var(--warn-soft);border:1px solid oklch(0.82 0.08 82);"></span>Rezervēts</span>
      <span style="display:flex;align-items:center;gap:7px;"><span style="width:14px;height:14px;border-radius:4px;background:var(--danger-soft);border:1px solid oklch(0.8 0.06 25);"></span>Bloķēts</span>
  </div>
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:var(--gap);">

// ============ CONTAINER SHAPE EDITOR ============
// Set a grid size, then click or drag over cells to switch places on and off, so
// the drawing matches the real rack — L-shaped, with gaps, whatever it is. A place
// is numbered by its POSITION (index+1), so switching a cell off never renumbers
// the ones around it and can't silently rename a spot that holds someone's tires.
const _cg={rows:4,cols:20,cells:[],paint:null,zones:[],zoneSel:-1};
function cgTotal(){return _cg.rows*_cg.cols;}
function cgString(){return _cg.cells.map(v=>v?'1':'0').join('');}
function cgCount(){return _cg.cells.reduce((a,v)=>a+(v?1:0),0);}
const ZONE_HUES=[285,200,60,330,155,25];
function cgZoneOf(i){return _cg.zones.findIndex(z=>z.cells.includes(i));}
function cgResize(rows,cols,keep){
  const old=_cg.cells,oc=_cg.cols;
  _cg.rows=rows;_cg.cols=cols;
  const next=[];
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
    // Preserve the drawing by grid position when the size changes.
    next.push(keep&&old.length?(r*oc+c<old.length&&c<oc?!!old[r*oc+c]:false):true);
  }
  _cg.cells=next;}
function cgRender(){
  const box=document.getElementById('cg-grid');if(!box)return;
  box.style.gridTemplateColumns=`repeat(${_cg.cols},minmax(0,1fr))`;
  box.innerHTML=_cg.cells.map((on,i)=>{
    const zi=cgZoneOf(i);
    let st;
    if(!on)st='background:transparent;border:1px dashed var(--border-2);color:transparent;';
    else if(zi>=0){const h=ZONE_HUES[zi%ZONE_HUES.length];st=`background:oklch(0.93 0.05 ${h});border:1px solid oklch(0.7 0.12 ${h});color:oklch(0.42 0.14 ${h});font-weight:700;`;}
    else st='background:var(--ok-soft);border:1px solid oklch(0.8 0.08 155);color:var(--ok);';
    return `<button type="button" data-cg="${i}" title="${!on?'Tukšums':zi>=0?('Zona '+_cg.zones[zi].name):'Vieta'}" style="aspect-ratio:1;min-width:0;border-radius:4px;cursor:pointer;font-size:8px;line-height:1;padding:0;overflow:hidden;${st}">${!on?'':zi>=0?esc(_cg.zones[zi].name[0]):(i+1)}</button>`;
  }).join('');
  const n=document.getElementById('cg-count');
  if(n){const zc=_cg.zones.reduce((a,z)=>a+z.cells.length,0);
    n.textContent=`${cgCount()-zc} vietas + ${_cg.zones.length} zonas (${zc} rūtiņas) no ${cgTotal()} rūtiņām`;}
  const zl=document.getElementById('cg-zones');
  if(zl)zl.innerHTML=_cg.zones.map((z,i)=>{const h=ZONE_HUES[i%ZONE_HUES.length];const on=_cg.zoneSel===i;
    return `<span style="display:inline-flex;align-items:center;gap:6px;padding:4px 9px;border-radius:7px;font-size:12px;font-weight:600;cursor:pointer;background:oklch(0.93 0.05 ${h});color:oklch(0.42 0.14 ${h});border:2px solid ${on?`oklch(0.55 0.15 ${h})`:'transparent'};" data-cgzone="${i}">${esc(z.name)} · ${z.cells.length} rūt. · maks. ${z.cap}<button type="button" data-cgzonedel="${i}" title="Dzēst zonu" style="border:0;background:transparent;cursor:pointer;font-size:12px;color:inherit;padding:0;line-height:1;">✕</button></span>`;}).join(' ')||'<span style="color:var(--ink-3);font-size:12px;">Nav zonu.</span>';
  box.querySelectorAll('[data-cg]').forEach(el=>{
    const i=Number(el.dataset.cg);
    const act=()=>{
      // With a zone selected, clicks assign/unassign cells to it; otherwise they
      // paint the shape on/off as before.
      if(_cg.zoneSel>=0){
        if(!_cg.cells[i])return;
        const z=_cg.zones[_cg.zoneSel];
        const other=cgZoneOf(i);
        if(other>=0&&other!==_cg.zoneSel)_cg.zones[other].cells=_cg.zones[other].cells.filter(x=>x!==i);
        const at=z.cells.indexOf(i);
        if(at>=0)z.cells.splice(at,1);else z.cells.push(i);
        cgRender();return;}
      const v=_cg.paint!==null?_cg.paint:!_cg.cells[i];
      if(_cg.cells[i]!==v){_cg.cells[i]=v;
        if(!v)_cg.zones.forEach(z=>{z.cells=z.cells.filter(x=>x!==i);});
        cgRender();}};
    el.addEventListener('mousedown',e=>{e.preventDefault();if(_cg.zoneSel<0)_cg.paint=!_cg.cells[i];act();});
    el.addEventListener('mouseenter',()=>{if(_cg.paint!==null&&_cg.zoneSel<0)act();});
    el.addEventListener('touchstart',e=>{e.preventDefault();act();},{passive:false});
  });
  const zlist=document.getElementById('cg-zones');
  if(zlist){
    zlist.querySelectorAll('[data-cgzonedel]').forEach(el=>el.addEventListener('click',e=>{e.stopPropagation();
      _cg.zones.splice(Number(el.dataset.cgzonedel),1);_cg.zoneSel=-1;cgRender();}));
    zlist.querySelectorAll('[data-cgzone]').forEach(el=>el.addEventListener('click',()=>{
      const i=Number(el.dataset.cgzone);_cg.zoneSel=_cg.zoneSel===i?-1:i;cgRender();}));
  }}
function cgStopPaint(){_cg.paint=null;}
function cgFormHTML(opts){
  const o=opts||{};
  return `<div style="text-align:left;display:flex;flex-direction:column;gap:12px;">
    ${o.prefix===undefined?`<div><label class="label" style="display:block;margin-bottom:5px;">Prefikss (burts)</label><input id="cg-prefix" class="swal2-input mono" placeholder="D" maxlength="4" style="margin:0;width:100%;text-transform:uppercase;"></div>`
      :`<div style="font-size:13px;color:var(--ink-2);">Konteiners <b class="mono">${esc(o.prefix)}</b></div>`}
    <div style="display:flex;gap:12px;">
      <div style="flex:1;"><label class="label" style="display:block;margin-bottom:5px;">Rindas</label><input id="cg-rows" type="number" min="1" max="99" value="${_cg.rows}" class="swal2-input mono" style="margin:0;width:100%;"></div>
      <div style="flex:1;"><label class="label" style="display:block;margin-bottom:5px;">Kolonnas</label><input id="cg-cols" type="number" min="1" max="99" value="${_cg.cols}" class="swal2-input mono" style="margin:0;width:100%;"></div>
    </div>
    <div>
      <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;gap:10px;flex-wrap:wrap;">
        <span class="label">Uzzīmē formu</span>
        <span style="display:flex;gap:6px;">
          <button type="button" id="cg-all" style="height:26px;padding:0 9px;font-size:11px;border:1px solid var(--border-2);background:var(--surface);border-radius:6px;cursor:pointer;">Visas</button>
          <button type="button" id="cg-none" style="height:26px;padding:0 9px;font-size:11px;border:1px solid var(--border-2);background:var(--surface);border-radius:6px;cursor:pointer;">Neviena</button>
        </span>
      </div>
      <div style="color:var(--ink-3);font-size:11px;margin-bottom:8px;">Klikšķini vai velc pāri rūtiņām, lai ieslēgtu/izslēgtu vietas. Numuri paliek pēc pozīcijas, tāpēc esošās vietas nepārnumurējas.</div>
      <div id="cg-grid" style="display:grid;gap:3px;max-height:290px;overflow:auto;padding:6px;background:var(--surface-2);border:1px solid var(--border);border-radius:9px;"></div>
      <div id="cg-count" style="color:var(--ink-3);font-size:12px;margin-top:7px;"></div>
    </div>
    <div>
      <span class="label" style="display:block;margin-bottom:6px;">Zonas — lielākas vietas</span>
      <div style="color:var(--ink-3);font-size:11px;margin-bottom:8px;">Zona apvieno vairākas rūtiņas vienā vietā ar savu nosaukumu un maksimālo komplektu skaitu. Pievieno zonu, tad klikšķini uz rūtiņām, lai to iezīmētu; vēlreiz klikšķis uz zonas pogas beidz iezīmēšanu.</div>
      <div style="display:flex;gap:8px;margin-bottom:8px;">
        <input id="zn-name" class="swal2-input mono" placeholder="GRĪDA1" maxlength="8" style="margin:0;flex:1.4;min-width:0;text-transform:uppercase;height:38px;font-size:14px;">
        <input id="zn-cap" type="number" min="1" max="99" value="6" title="Maks. komplekti" class="swal2-input mono" style="margin:0;flex:.7;min-width:0;height:38px;font-size:14px;">
        <button type="button" id="cg-zoneadd" style="height:38px;padding:0 12px;font-size:12px;font-weight:600;border:1px solid var(--border-2);background:var(--surface);border-radius:8px;cursor:pointer;white-space:nowrap;">＋ Zona</button>
      </div>
      <div id="cg-zones" style="display:flex;gap:6px;flex-wrap:wrap;"></div>
    </div>
    <div><label class="label" style="display:block;margin-bottom:5px;">Nosaukums (neobligāts)</label><input id="cg-label" class="swal2-input" value="${esc(o.label||'')}" placeholder="piem. Ziemas plaukts" style="margin:0;width:100%;"></div>
  </div>`;}
function cgWire(){
  const sync=(keep)=>{
    const r=Math.max(1,Math.min(99,parseInt(document.getElementById('cg-rows').value,10)||1));
    const c=Math.max(1,Math.min(99,parseInt(document.getElementById('cg-cols').value,10)||1));
    if(r*c>600){Swal.showValidationMessage('Pārāk liels konteiners (maks. 600 rūtiņas)');return;}
    Swal.resetValidationMessage&&Swal.resetValidationMessage();
    cgResize(r,c,keep);cgRender();};
  ['cg-rows','cg-cols'].forEach(id=>document.getElementById(id).addEventListener('input',()=>sync(true)));
  document.getElementById('cg-all').addEventListener('click',()=>{_cg.cells=_cg.cells.map(()=>true);cgRender();});
  document.getElementById('cg-none').addEventListener('click',()=>{_cg.cells=_cg.cells.map(()=>false);_cg.zones.forEach(z=>z.cells=[]);cgRender();});
  const za=document.getElementById('cg-zoneadd');
  if(za)za.addEventListener('click',()=>{
    const nameEl=document.getElementById('zn-name'),capEl=document.getElementById('zn-cap');
    const name=(nameEl.value||'').trim().toUpperCase().replace(/\s+/g,'');
    const cap=parseInt(capEl.value,10);
    if(!/^[A-ZĀČĒĢĪĶĻŅŠŪŽ0-9-]{1,8}$/.test(name)){Swal.showValidationMessage('Zonas nosaukums: 1–8 burti/cipari');return;}
    if(_cg.zones.some(z=>z.name===name)){Swal.showValidationMessage('Šāda zona jau ir');return;}
    if(!(cap>=1&&cap<=99)){Swal.showValidationMessage('Maks. komplekti: 1–99');return;}
    Swal.resetValidationMessage&&Swal.resetValidationMessage();
    _cg.zones.push({name,cap,cells:[]});
    _cg.zoneSel=_cg.zones.length-1;nameEl.value='';cgRender();});
  document.addEventListener('mouseup',cgStopPaint);
  cgRender();}
async function addContainerDialog(){
  if(!R1)return;
  cgResize(4,20,false);_cg.zones=[];_cg.zoneSel=-1;
  const {value:form}=await R1.fire({title:'Pievienot konteineru',width:640,
    html:cgFormHTML({}),
    showCancelButton:true,confirmButtonText:'Izveidot',cancelButtonText:'Atcelt',customClass:{popup:'r1-swal'},
    didOpen:cgWire,willClose:cgStopPaint,
    preConfirm:()=>{const prefix=(document.getElementById('cg-prefix').value||'').trim().toUpperCase();
      if(!/^[A-ZĀČĒĢĪĶĻŅŠŪŽ]{1,4}$/.test(prefix)){Swal.showValidationMessage('Prefikss: 1–4 burti (piem. D)');return false;}
      if(!cgCount()){Swal.showValidationMessage('Jāatzīmē vismaz viena vieta');return false;}
      return {prefix,rows:_cg.rows,cols:_cg.cols,cells:cgString(),zones:JSON.stringify(_cg.zones.filter(z=>z.cells.length)),label:document.getElementById('cg-label').value.trim()||null};}});
  if(!form)return;
  const res=await fetch('/api/containers',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(form)});
  const data=await res.json().catch(()=>({}));
  if(!res.ok||!data.ok){alertErr(data.error?.message||'Neizdevās izveidot konteineru');return;}
  toast('Konteiners '+form.prefix+' izveidots');
  await loadStats();render();}
async function editContainerDialog(id,prefix){
  if(!R1)return;
  const c=((S.stats&&S.stats.containers)||[]).find(x=>String(x.defId)===String(id));
  if(!c){alertErr('Konteineru var rediģēt tikai pēc tā izveides');return;}
  const rows=c.rows||Math.ceil((c.total||1)/(c.cols||4)),cols=c.cols||4;
  cgResize(rows,cols,false);
  if(c.drawn)_cg.cells=_cg.cells.map((_,i)=>c.drawn[i]!=='0');
  _cg.zones=(c.zones||[]).map(z=>({name:z.name,cap:z.cap,cells:[...z.cells]}));_cg.zoneSel=-1;
  const {value:form}=await R1.fire({title:'Rediģēt konteineru',width:640,

// Admin Excel import: dry-run preview (does NOT touch DB) → confirm → real import that REPLACES all data.
function impErr(o,res){return (o&&o.error&&(o.error.message||o.error))||('HTTP '+(res?res.status:'?'));}
async function doImport(file){
  const mkFd=()=>{const fd=new FormData();fd.append('file',file);return fd;};
  let prev,res;
  try{
    R1&&R1.fire({title:'Analizē failu…',html:esc(file.name),allowOutsideClick:false,didOpen:()=>R1.showLoading()});
    res=await fetch('/api/import?dryRun=1',{method:'POST',body:mkFd()});
    prev=await res.json().catch(()=>({}));
    if(!res.ok||!prev.ok)throw new Error(impErr(prev,res));
  }catch(e){R1&&R1.close();alertErr('Neizdevās nolasīt failu: '+(e.message||e));return;}
  const sample=prev.sample||[];
  const cols=[['location','Vieta'],['plate','Nr.'],['makeModel','Auto'],['customerName','Klients'],['size1','Izmērs'],['size2','2.izm.'],['brand','Ražotājs'],['quantity','Sk.'],['season','Sezona']];
  const th=cols.map(c=>`<th style="text-align:left;padding:4px 8px;border-bottom:1px solid #ddd;font-weight:600;white-space:nowrap;">${c[1]}</th>`).join('');
  const trs=sample.map(r=>`<tr>${cols.map(c=>`<td style="padding:3px 8px;border-bottom:1px solid #f0f0f0;white-space:nowrap;max-width:150px;overflow:hidden;text-overflow:ellipsis;">${esc(r[c[0]]==null?'':r[c[0]])}</td>`).join('')}</tr>`).join('');
  const html=`<div style="text-align:left;font-size:13px;">
    <div style="display:flex;gap:16px;flex-wrap:wrap;margin-bottom:10px;">
      <div><b style="font-size:18px;">${prev.parsed}</b> ieraksti</div>
      <div style="color:#666;"><b>${prev.sheets}</b> sezonu lapas · ${prev.rows} rindas · ${prev.skipped} tukšas</div>
    </div>
    <div style="max-height:260px;overflow:auto;border:1px solid #eee;border-radius:8px;"><table style="border-collapse:collapse;width:100%;font-size:12px;"><thead><tr>${th}</tr></thead><tbody>${trs}</tbody></table></div>
    <div style="margin-top:8px;color:#999;font-size:11px;">Rāda pirmos ${sample.length} ierakstus priekšskatam.</div>
    <div style="margin-top:10px;padding:9px 11px;background:#fdecec;color:#b91c1c;border-radius:8px;font-weight:600;">⚠ Šis aizvietos VISUS pašreizējos datus ar šī faila saturu.<div style="font-weight:400;margin-top:4px;">Ierakstu numuri tiek pārnumurēti, tāpēc tiks dzēsta arī <b>darbību vēsture, komentāri, bildes</b> un noliktavas uzdevumi, kas piesaistīti ierakstiem.</div></div>
  </div>`;
  const r=await ask({icon:'warning',title:'Apstiprināt importu?',html,width:760,confirmButtonText:`Importēt (${prev.parsed})`,confirmButtonColor:'#b91c1c',cancelButtonText:'Atcelt'});
  if(!r.isConfirmed)return;
  try{
    R1&&R1.fire({title:'Importē…',html:'Aizvieto datus',allowOutsideClick:false,didOpen:()=>R1.showLoading()});
    const res2=await fetch('/api/import',{method:'POST',body:mkFd()});
    const out=await res2.json().catch(()=>({}));
    if(!res2.ok||!out.ok)throw new Error(impErr(out,res2));
    R1&&R1.close();
    toast('Importēts: '+(out.imported!=null?out.imported:prev.parsed)+' ieraksti');
    await Promise.all([loadTable(),loadStats()]);updateTabContent();
  }catch(e){R1&&R1.close();alertErr('Imports neizdevās: '+(e.message||e));}
}

// ============ RECORD PHOTOS ============
// Pictures of the set as it was handed in. On a phone "Uzņemt" opens the camera
// straight away (capture=environment); everything is downscaled in the browser
// before upload, so a 4 MB phone photo lands as roughly 200 KB.
// 1280px is plenty to read tread and damage on a phone, and keeps a typical
// upload in the low hundreds of KB — these rows live in the database.
const PHOTO_MAX=1280,PHOTO_QUALITY=0.8;
function readImage(file){return new Promise((resolve,reject)=>{
  const url=URL.createObjectURL(file);const img=new Image();
  img.onload=()=>{URL.revokeObjectURL(url);resolve(img);};
  img.onerror=()=>{URL.revokeObjectURL(url);reject(new Error('Neizdevās nolasīt attēlu'));};
  img.src=url;});}
async function shrinkImage(file){
  const img=await readImage(file);
  const scale=Math.min(1,PHOTO_MAX/Math.max(img.naturalWidth,img.naturalHeight));
  const w=Math.max(1,Math.round(img.naturalWidth*scale)),h=Math.max(1,Math.round(img.naturalHeight*scale));
  const c=document.createElement('canvas');c.width=w;c.height=h;
  c.getContext('2d').drawImage(img,0,0,w,h);
  const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',PHOTO_QUALITY));
  // A canvas re-encode that somehow grew the file isn't worth it — send the original.
  if(!blob||(blob.size>=file.size&&file.type==='image/jpeg'))return {blob:file,w:img.naturalWidth,h:img.naturalHeight};
  return {blob,w,h};}
function revokePhotos(list){(list||[]).forEach(p=>{if(p.src){try{URL.revokeObjectURL(p.src);}catch{}}});}
async function loadRecPhotos(id){S.recPhotosLoading=true;
  try{const d=await(await fetch('/api/storage/'+encodeURIComponent(id)+'/photos')).json();
    const list=d.photos||[];
    // Pull the bytes through the patched fetch so they carry the auth header —
    // a plain <img src="/api/photos/…"> relies on the cookie alone and 401s in
    // any browser that blocks it.
    await Promise.all(list.map(async p=>{try{const r=await fetch(p.url);if(r.ok)p.src=URL.createObjectURL(await r.blob());}catch{}}));
    if(S.recData&&String(S.recData.id)===String(id)){revokePhotos(S.recPhotos);S.recPhotos=list;}
    else revokePhotos(list);
  }catch{S.recPhotos=[];}
  S.recPhotosLoading=false;if(S.recOpen)renderModal();}
async function uploadRecPhotos(files){
  const r=S.recData;if(!r||!files||!files.length)return;
  const list=[...files].filter(f=>/^image\//.test(f.type));
  if(!list.length){alertErr('Izvēlies attēla failu');return;}
  S.recPhotoBusy=`Augšupielādē 0/${list.length}…`;renderModal();
  let done=0,failed=0;
  for(const f of list){
    try{
      const {blob,w,h}=await shrinkImage(f);
      const fd=new FormData();
      fd.append('photo',blob,(f.name||'foto').replace(/\.[^.]+$/,'')+'.jpg');
      fd.append('width',w);fd.append('height',h);
      const res=await fetch('/api/storage/'+encodeURIComponent(r.id)+'/photos',{method:'POST',body:fd});
      if(!res.ok)failed++;
    }catch{failed++;}
    done++;S.recPhotoBusy=`Augšupielādē ${done}/${list.length}…`;renderModal();
  }
  S.recPhotoBusy='';
  if(failed)alertErr(failed===list.length?'Neizdevās augšupielādēt':`${failed} no ${list.length} bildēm neizdevās`);
  else toast(list.length===1?'Bilde pievienota':`Pievienotas ${list.length} bildes`);
  await Promise.all([loadRecPhotos(r.id),loadRecEvents(r.id)]);}
async function deleteRecPhoto(id){

// ============ EXCEL EXPORT ============
// The download goes through the patched fetch so it carries the auth header — a
// plain <a download> would rely on the cookie alone and fail where it's blocked.
const XLS_BTN='height:38px;padding:0 14px;background:var(--surface);border:1px solid var(--border-2);border-radius:9px;font-size:13px;font-weight:500;cursor:pointer;color:var(--ink-2);white-space:nowrap;';
function exportBtn(what,params,label){
  return `<button data-export="${esc(what)}" data-params="${esc(params||'')}" title="Lejupielādēt Excel failu" style="${XLS_BTN}">⭳ ${esc(label||'Excel')}</button>`;}
async function downloadExport(what,params){
  const url='/api/export/'+encodeURIComponent(what)+(params?('?'+params):'');
  try{
    const res=await fetch(url);
    if(!res.ok){const d=await res.json().catch(()=>({}));alertErr(d.error?.message||'Neizdevās izveidot failu');return;}
    const blob=await res.blob();
    const cd=res.headers.get('Content-Disposition')||'';
    const m=cd.match(/filename="([^"]+)"/);
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download=m?m[1]:(what+'.xlsx');
    document.body.appendChild(a);a.click();
    setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1500);
    toast('Fails lejupielādēts');
  }catch{alertErr('Neizdevās lejupielādēt');}}

// ---- Notifications: Web Push when configured, in-app alerts otherwise ----
const b64ToU8=(s)=>{const p='='.repeat((4-s.length%4)%4);const b=atob((s+p).replace(/-/g,'+').replace(/_/g,'/'));
  const out=new Uint8Array(b.length);for(let i=0;i<b.length;i++)out[i]=b.charCodeAt(i);return out;};
async function enablePush(){
  if(typeof Notification==='undefined'){alertErr('Šī pārlūkprogramma neatbalsta paziņojumus');return;}
  let perm=Notification.permission;
  if(perm!=='granted')perm=await Notification.requestPermission();
  if(perm!=='granted'){alertErr('Paziņojumi ir bloķēti. Atļauj tos pārlūka iestatījumos šai lapai.');render();return;}
  await subscribePush();
  toast('Paziņojumi ieslēgti');render();}
// Register this device with the server so it gets pushed even when the app is closed.
async function subscribePush(){
  if(!('serviceWorker' in navigator)||!('PushManager' in window))return false;
  try{
    if(!S.pushCfg)S.pushCfg=await(await fetch('/api/push/key')).json();
    if(!S.pushCfg||!S.pushCfg.enabled||!S.pushCfg.publicKey)return false; // push not configured — polling covers it
    const reg=await navigator.serviceWorker.ready;
    let sub=await reg.pushManager.getSubscription();
    if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64ToU8(S.pushCfg.publicKey)});
    const res=await fetch('/api/push/subscribe',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(sub.toJSON())});
    S.pushOn=res.ok;return res.ok;
  }catch(e){console.warn('push subscribe failed',e);return false;}}
// Poll for new jobs. Keeps the badge live everywhere in the app and — when real
// push isn't configured — raises a local notification for anything new.
let _seenTasks=null,_taskPoll=null;
async function pollTasks(){
  if(!S.auth)return;
  let list=[];
  try{list=(await(await fetch('/api/tasks?status=open')).json()).tasks||[];}catch{return;}
  S.openTasks=list.length;paintTaskBadge();
  const ids=new Set(list.map(t=>String(t.id)));
  if(_seenTasks){
    const fresh=list.filter(t=>!_seenTasks.has(String(t.id)));
    // Skip local alerts when the server pushes them — otherwise the phone buzzes twice.
    if(fresh.length&&!S.pushOn&&typeof Notification!=='undefined'&&Notification.permission==='granted'&&document.visibilityState!=='visible'){
      fresh.slice(0,3).forEach(t=>{try{new Notification(t.kind==='prepare'?'R1 · Sagatavot riepas':'R1 · Jauns pasūtījums',
        {body:[t.location?'Vieta '+t.location:'',t.title,t.details].filter(Boolean).join(' · ').slice(0,160),icon:'/icon-192.png',tag:'r1-task-'+t.id});}catch{}});}
  }
  _seenTasks=ids;
  if(S.screen==='warehouse'&&(S.taskTab||'open')==='open'){S.tasks=list;S.tasksLoaded=true;updateTaskList();}}
function startTaskPolling(){if(_taskPoll)clearInterval(_taskPoll);_taskPoll=setInterval(pollTasks,20000);

// ============ EVENTS ============
function bind(root){
  root.querySelectorAll('[data-act]').forEach(el=>el.addEventListener('click',async()=>{
    const a=el.dataset.act;
    if(a==='new-intake'){resetIntake();nav('intake');}
    else if(a==='go-spots')nav('spots');
    else if(a==='go-customers')nav('customers');
    else if(a==='lookup')await doLookup();
    else if(a==='reset'){resetIntake();render();}
    else if(a==='confirm')await confirmIntake();
    else if(a==='new-user')await newUserDialog();
    else if(a==='go-release')nav('release');
    else if(a==='go-pending')nav('pending');
    else if(a==='go-warehouse')nav('warehouse');
    else if(a==='task-send')await sendTask();
    else if(a==='enable-push')await enablePush();
    else if(a==='price-add'){grabPricing();const t=S.pricingDraft.tiers;const last=t[t.length-1];
      t.push({from:last?Math.min(999,last.to+1):0,to:999,price:last?last.price:15});render();}
    else if(a==='price-save')await savePricing();
    else if(a==='price-reset'){S.pricingDraft=JSON.parse(JSON.stringify(S.pricing||DEF_PRICING));render();toast('Izmaiņas atceltas','info');}
    else if(a==='price-recalc')await recalcPrices();
    else if(a==='push-test')await sendTestPush();
    else if(a==='hist-more')await loadHist(false);
    else if(a==='hist-clear'){Object.assign(S.hist,{from:'',to:'',type:'',q:'',page:0,list:[]});render();await loadHist(true);}
    else if(a==='go-history')nav('history');
    else if(a==='rel-search'){const q=document.getElementById('rel-q');S.relQ=q?q.value:S.relQ;await loadRelease();updateReleaseContent();}

function grab(){const g=(id,k)=>{const el=$(id);if(el)S[k]=el.value;};
  g('#in-plate','plate');g('#in-size','t1size');g('#in-brand','t1brand');g('#in-qty','t1qty');g('#in-thread','thread');

// Live summary WITHOUT re-rendering the page (no flicker while typing).
function tiresLine(){const b1=canonBrand(S.t1brand)||'—';
  if(S.t1qty==='2+2')return S.t1size?('2× '+b1+' '+S.t1size+(S.t2size?' + 2× '+(canonBrand(S.t2brand)||b1)+' '+S.t2size:'')):'—';
  return (S.t1qty&&S.t1size)?(S.t1qty+'× '+b1+' '+S.t1size):'—';}
function updateSummary(){const set=(id,v)=>{const el=document.getElementById(id);if(el)el.textContent=v;};
  const p=price();
  set('sum-cust',S.looked?(S.cust&&S.cust.trim()?S.cust:(S.isNew?'Jauns klients':'—')):'—');
  set('sum-plate',S.plate?S.plate.toUpperCase():'—');
  set('sum-tires',tiresLine());
  set('sum-thread',S.thread?S.thread+' mm':'—');
  set('sum-cls','('+p.cls+')');set('sum-base',p.w?eur(p.base):'—');
  set('sum-mult','× '+p.mult.toFixed(1));set('sum-total',p.w?eur(p.total):'—');
  const btn=document.getElementById('btn-confirm');
  if(btn){const miss=[];
    if(!S.looked)miss.push('meklē numuru');
    if(S.isNew&&!(S.cust&&S.cust.trim()))miss.push('klienta vārds');
    if(!S.t1size)miss.push('izmērs');
    if(!S.thread)miss.push('protektors');
    if(S.t1qty==='2+2'&&!S.t2size)miss.push('2. pāra izmērs');
    const hint=document.getElementById('confirm-hint');
    if(hint)hint.textContent=miss.length?('Trūkst: '+miss.join(', ')):'';
    const ok=miss.length===0;
    btn.disabled=!ok;
    btn.style.cssText='height:46px;margin-top:4px;border:0;border-radius:11px;font-weight:600;font-size:15px;'+(ok?'background:var(--accent);color:#fff;cursor:pointer;box-shadow:0 1px 2px oklch(0.55 0.17 256 / .3);':'background:var(--border);color:var(--ink-3);cursor:not-allowed;');}}
// Inline type-ahead: completes the brand IN the field while typing (not a dropdown).
function typeAhead(el,ev){if(ev&&ev.inputType&&ev.inputType.startsWith('delete'))return;
  const v=el.value;if(!v)return;
  const hit=BRANDS.find(b=>b.toLowerCase().startsWith(v.toLowerCase()));
  if(hit&&hit!==v){const keep=v.length;el.value=hit;el.setSelectionRange(keep,hit.length);}}
document.addEventListener('input',e=>{const id=e.target.id;
  if(id==='in-size'||id==='in-size2'){const m=maskSize(e.target.value);if(m!==e.target.value){e.target.value=m;e.target.setSelectionRange(m.length,m.length);}}
  if(id==='in-brand'||id==='in-brand2')typeAhead(e.target,e);
  if(id==='in-plate'){const v=e.target.value;clearTimeout(_plateT);_plateT=setTimeout(()=>plateSuggest(v),140);}
  if(id==='in-cust'){const v=e.target.value;clearTimeout(_compT);_compT=setTimeout(()=>companySuggest(v),160);}
  if(['in-plate','in-size','in-brand','in-thread','in-cust','in-phone','in-size2','in-brand2','in-qty'].includes(id)){grab();updateSummary();}});
document.addEventListener('change',e=>{if(e.target.id==='in-qty'){grab();render();}});

  if(!plate){render();return;}
  const r=await ask({icon:'success',title:'Riepas izsniegtas',

async function doLookup(){grab();hidePlateSuggest();
  const plate=(S.plate||'').toUpperCase().replace(/\s/g,'');
  if(!plate)return;
  S.plate=plate;
  try{const d=await(await fetch('/api/lookup?plate='+encodeURIComponent(plate))).json();
    if(d.found){const s=d.suggestion||{};
      Object.assign(S,{looked:true,isNew:false,isCompany:!!s.isCompany,cust:s.customerName||'—',phone:s.phone||'',history:d.history,
        t1size:s.size1||S.t1size,t1brand:s.brand||S.t1brand,
        t1qty:(String(s.quantity||'')==='2+2'?'2+2':(String(s.quantity||'').match(/^\d$/)?String(s.quantity):S.t1qty)),t2size:s.size2||'',
        rim:/alum|liet/i.test(s.rimNote||'')?'aluminum':/tērau|terau|dzelz/i.test(s.rimNote||'')?'steel':S.rim});
    } else Object.assign(S,{looked:true,isNew:true,isCompany:false,cust:'',phone:'',history:0});
  }catch{Object.assign(S,{looked:true,isNew:true,cust:'',history:0});}
  render();}

async function confirmIntake(){grab();
  if(!(S.looked&&S.t1size&&S.thread))return;
  if(!(S.looked&&(!S.isNew||S.cust.trim())))return;
  const is22=S.t1qty==='2+2';

  const b1=canonBrand(S.t1brand),b2=canonBrand(S.t2brand);
  const brand=is22&&b2&&b2!==b1?[b1,b2].filter(Boolean).join(' + '):(b1||null);
  const body={plate:S.plate,customerName:(S.cust&&S.cust.trim())||null,isCompany:!!S.isCompany,phone:(S.phone&&S.phone.trim())||null,
    size1:maskSize(S.t1size)||S.t1size,brand,size2:is22?(maskSize(S.t2size)||S.t2size):null,
    quantity:S.t1qty,rim:S.rim,threadDepth:S.thread,location:S.presetSpot||null,releaseId:S.swapFromId||null};
  const res=await fetch('/api/intake',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});

// Strong random password from an unambiguous alphabet (no 0/O, 1/l/I).
function genPassword(len){len=len||12;
  const U='ABCDEFGHJKLMNPQRSTUVWXYZ',L='abcdefghijkmnopqrstuvwxyz',D='23456789',SY='!@#$%*?-_';
  const all=U+L+D+SY;
  const rnd=n=>{const a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]%n;};
  const out=[U[rnd(U.length)],L[rnd(L.length)],D[rnd(D.length)],SY[rnd(SY.length)]];
  while(out.length<len)out.push(all[rnd(all.length)]);
  for(let i=out.length-1;i>0;i--){const j=rnd(i+1);const t=out[i];out[i]=out[j];out[j]=t;}
  return out.join('');}
async function copyText(t){try{await navigator.clipboard.writeText(t);return true;}catch{return false;}}
function slugUser(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'').slice(0,20);}
const passRow=(id)=>`<div style="display:flex;gap:8px;align-items:stretch;"><input id="${id}" class="swal2-input mono" style="margin:0;flex:1;letter-spacing:.03em;"><button type="button" id="${id}-gen" class="r1-btn r1-btn-ghost" style="height:auto;padding:0 12px;white-space:nowrap;font-size:14px;">🎲 Ģenerēt</button></div>`;
function wireGen(inputId){const g=document.getElementById(inputId+'-gen');if(g)g.addEventListener('click',()=>{document.getElementById(inputId).value=genPassword(12);});}

  $('#lg-forgot').addEventListener('click',()=>ask({icon:'info',title:'Aizmirsi paroli?',html:'Sazinies ar administratoru, lai atiestatītu paroli.<br><span style="color:var(--ink-3);font-size:13px;">Administrators to izdara sadaļā <b>Lietotāji → Atiestatīt paroli</b>.</span>',showCancelButton:false,confirmButtonText:'Sapratu'}));
  setTimeout(()=>{try{user.focus();}catch{}},60);}
function hideLogin(){const g=$('#gate');if(g){g.innerHTML='';g.style.cssText='';}document.body.style.overflow='';}

// The warehouse phone lives on one screen — reopen where the user left off, and
// let ?view= (notification click / home-screen shortcut) jump straight there.
const SCREENS=['home','warehouse','intake','release','pending','spots','customers','table','analytics','history','users','settings'];
const ADMIN_SCREENS=['users','settings']; // never the screen a session reopens on
const LAST_KEY='r1_last_view';
function openView(v){if(SCREENS.includes(v)){document.body.classList.remove('nav-open');nav(v);}}
function initialScreen(){
  if(isWarehouse())return 'warehouse';
  const p=new URLSearchParams(location.search).get('view');
  if(p&&SCREENS.includes(p))return p;
  try{const v=localStorage.getItem(LAST_KEY);if(v&&SCREENS.includes(v)&&!ADMIN_SCREENS.includes(v))return v;}catch{}
  return 'home';}

function isWarehouse(){return !!(S.auth&&S.auth.role==='warehouse');}
async function startApp(){
  S.role=(S.auth&&S.auth.role==='admin')?'owner':'staff';
  paintHeader();
  nav(initialScreen());
  if(isWarehouse()){
    // Only the queue — every desk endpoint would 403 for this role anyway.
    await pollTasks();
    render();startTaskPolling();subscribePush();
    return;
  }
  await Promise.all([loadStats(),loadActivity(),loadCustomers(),loadPending(),pollTasks(),loadPricing()]);
  render();
  startTaskPolling();
  subscribePush(); // silently re-attaches an already-granted device after a reload
}

// ============ INIT ============
function bindTopbar(){
  const lo=$('#btn-logout');if(lo)lo.addEventListener('click',doLogout);
  const cp=$('#btn-changepass');if(cp)cp.addEventListener('click',changePasswordDialog);
  const hb=$('#hamburger');if(hb)hb.addEventListener('click',()=>document.body.classList.toggle('nav-open'));
  const bd=$('#nav-backdrop');if(bd)bd.addEventListener('click',()=>document.body.classList.remove('nav-open'));}
// Service worker: makes the app installable on a phone and delivers push
// notifications while it's closed. Harmless (and skipped) on http:// origins.
function registerSW(){
  if(!('serviceWorker' in navigator))return;
  navigator.serviceWorker.register('/sw.js').catch(e=>console.warn('sw register failed',e));
  navigator.serviceWorker.addEventListener('message',e=>{
    const d=e.data||{};
    if(d.type==='r1-open'){try{const v=new URL(d.url,location.origin).searchParams.get('view');if(v)openView(v);}catch{}}});}
(async function(){
  bindTopbar();registerSW();
  try{
    const res=await fetch('/api/me');
    if(res.ok){const d=await res.json();S.auth=d.user;hideLogin();await startApp();}
    else showLogin();
  }catch{showLogin();}
})();
</script>
